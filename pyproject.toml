[build-system]
requires = ["setuptools>=69", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "nemophoto"
dynamic = ["version"]
description = "Absorption, fluorescence, phosphorescence spectrum simulations and ISC rate calculations."
readme = "README.md"
requires-python = ">=3.11"
license = { file =  "LICENSE"}
authors = [{ name = "Leonardo Evaristo de Sousa", email = "ledso@dtu.dk" }]
urls = { Homepage = "https://github.com/LeonardoESousa/NEMO" }


dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "tables",
  "LeoX>=0.10.3"
]

[project.scripts]
nemo = "nemo.__main__:main"
nemo_batch_run = "nemo.batch:run_batch"
nemo_tuning = "nemo.omega:main"
empirical_tuning = "nemo.empirical:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nemo = ["templates/*.in"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo*"]
exclude = ["tests", "*.tests", "*.tests.*", "tests.*"]

[tool.setuptools.dynamic]
version = { attr = "nemo.__version__.__version__" }

[project.optional-dependencies]
test = [
  "pytest"
]
